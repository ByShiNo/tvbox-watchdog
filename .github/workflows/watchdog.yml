name: TVBox 互监控 Watchdog

# B 仓监控 A 仓（tvbox-selfheal）的 Actions 心跳。
# A 停摆（workflow 被禁用 / 连续 8h 无运行）时，自动 enable + dispatch 把 A 拉起来。
# 本 workflow 每轮都写 state.json（check_time 每轮不同）→ 每轮 commit → B 仓永远活跃，
# 同样规避 GitHub 的 60 天闲置禁用规则。A、B 互相独立保活。

on:
  schedule:
    # 每 3 小时第 15 分（UTC），与 A 仓的整点错峰，避免同时段拥塞。
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判活与自恢复
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ByShiNo/tvbox-selfheal
          TARGET_WORKFLOW: heal.yml
          MAX_AGE_HOURS: '8'
        run: python check.py

      - name: 保活提交（每轮时间戳不同，保证仓库活跃）
        run: |
          git config user.name "tvbox-watchdog-bot"
          git config user.email "tvbox-watchdog-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: watchdog heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || { echo "PUSH_FAILED"; exit 1; }
          fi
